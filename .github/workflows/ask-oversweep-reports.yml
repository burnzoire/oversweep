name: Collect Ask Oversweep reports

on:
  schedule:
    - cron: '0 8 * * *'
      timezone: Australia/Melbourne
  workflow_dispatch:
    inputs:
      publish:
        description: Create report issues with public diagnostic metadata
        type: boolean
        default: false
      backfill:
        description: Query the full three-day log window
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: ask-oversweep-reports
  cancel-in-progress: false

jobs:
  collect:
    if: github.repository == 'burnzoire/oversweep' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.4'
      - run: node --test tests/ask/report-collector.test.mjs
      - run: node scripts/collect-ask-reports.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_REPORTS_API_TOKEN: ${{ secrets.CLOUDFLARE_REPORTS_API_TOKEN }}
          PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish }}
          BACKFILL: ${{ inputs.backfill }}
