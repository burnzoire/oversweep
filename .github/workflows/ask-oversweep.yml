name: Deploy Ask Oversweep Worker
on:
  workflow_dispatch:
  # Refresh the bundled knowledge corpus after a successful production publish.
  workflow_run:
    workflows: [Deploy GitHub Pages]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: ask-oversweep-worker
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Always build trusted, current main content, not a potentially stale workflow_run SHA.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.4'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx --yes wrangler@4.59.1 deploy --config workers/ask-oversweep/wrangler.jsonc --var ASK_REVISION:${{ github.sha }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
