name: Deploy Ask Oversweep Worker
on:
  workflow_dispatch:
  push:
    branches: [codex/ask-conversation-iterations]
    paths: [workers/ask-oversweep/**, scripts/search-index.mjs, .github/workflows/ask-oversweep.yml]
permissions:
  contents: read
concurrency:
  group: ask-oversweep-worker
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.4'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx --yes wrangler@4.59.1 deploy --config workers/ask-oversweep/wrangler.jsonc --var ASK_REVISION:${{ github.sha }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
