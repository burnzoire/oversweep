name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  # A PR preview was built or taken down (pr-preview.yml). This runs on main, so
  # the github-pages environment's main-only policy still holds.
  workflow_run:
    workflows: [PR preview]
    types: [completed]
permissions:
  contents: read
jobs:
  # PR preview runs that built or removed nothing (unlabelled PRs, other
  # comments) deploy nothing.
  plan:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      deploy: ${{ steps.plan.outputs.deploy }}
    steps:
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != workflow_run ]; then echo deploy=true >> "$GITHUB_OUTPUT"; exit 0; fi
          found=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" \
            --jq '[.artifacts[] | select((.name | startswith("preview-site-")) or .name == "preview-remove")] | length')
          echo "deploy=$([ "$found" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
  build:
    needs: plan
    if: needs.plan.outputs.deploy == 'true'
    # Job-level, so a skipped plan never displaces a waiting release. Each build
    # collects every current preview, so the newest waiting build is enough.
    concurrency:
      group: github-pages-build
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Require the application scaffold
        run: |
          test -f package-lock.json && test -f astro.config.mjs || {
            echo "::error::Merge the Astro application scaffold before deploying."
            exit 1
          }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
          cache: npm
      - run: npm ci
      - name: Validate foundation
        run: python3 scripts/check_docs.py
      - name: Check application
        run: npm run check
      # The site origin (https://www.oversweep.com) comes from astro.config.mjs,
      # not from the Pages settings, which report http:// while HTTPS is not
      # enforced and would put http:// URLs in the canonical tags and sitemap.
      - name: Build for www.oversweep.com
        env:
          PUBLIC_ASK_ENDPOINT: ${{ vars.PUBLIC_ASK_ENDPOINT }}
        run: |
          rm -rf dist
          npx --no-install astro build
          test -f dist/index.html
          grep -q '<loc>https://www.oversweep.com/' dist/sitemap.xml
      # After the live build, so previews stay out of its sitemap and search index.
      - name: Add PR previews
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/add-previews.sh
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
  deploy:
    needs: build
    concurrency:
      group: github-pages-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
