name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    permissions:
      contents: read
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Require the application scaffold
        run: |
          test -f package-lock.json && test -f astro.config.mjs || {
            echo "::error::Merge the Astro application scaffold before deploying."
            exit 1
          }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
          cache: npm
      - run: npm ci
      - name: Validate foundation
        run: python3 scripts/check_docs.py
      - name: Check application
        run: npm run check
      # The site origin (https://www.oversweep.com) comes from astro.config.mjs,
      # not from the Pages settings, which report http:// while HTTPS is not
      # enforced and would put http:// URLs in the canonical tags and sitemap.
      - name: Build for www.oversweep.com
        run: |
          rm -rf dist
          npx --no-install astro build
          test -f dist/index.html
          grep -q '<loc>https://www.oversweep.com/' dist/sitemap.xml
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
