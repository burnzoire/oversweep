name: Foundation checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test review source retrieval boundaries
        run: python3 -m unittest discover -s tests/review_sources -p 'test_*.py'
      - name: Validate foundation
        run: python3 scripts/check_docs.py

