name: Capture PR 275 switch screenshots
on:
  push:
    branches: [evidence/pr-275-switch-hitzones]
    paths: [.github/workflows/pr275-evidence.yml]
permissions:
  contents: write
jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: |
          python -m pip install playwright pillow
          python -m playwright install --with-deps chromium
          python .github/pr275-evidence.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add F16-switch-hitzone-evidence.png
          git commit -m "Capture every F-16C switch hit zone"
          git push
