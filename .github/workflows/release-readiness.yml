name: Release readiness

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: read

concurrency:
  group: release-readiness-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  release-readiness:
    name: Production inclusion
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
          cache: npm
      - run: npm ci
      - name: Test release gate decisions
        run: node --test tests/gates/*.test.mjs
      - name: Build ordinary production output
        run: env -u OVERSWEEP_REVIEW_TRAINERS npm run build
      - name: Require production inclusion for Case III changes
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: env -u OVERSWEEP_REVIEW_TRAINERS node scripts/check_release_readiness.mjs --base="$PR_BASE_SHA" --head="$PR_HEAD_SHA"
