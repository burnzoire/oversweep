name: Verify Ask Oversweep report on GitHub
on:
  push:
    branches:
      - codex/verify-complete-ask-report-flow
permissions:
  contents: read
  issues: write
concurrency:
  group: ask-oversweep-reports
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'burnzoire/oversweep'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.4'
      - run: node scripts/verify-report-on-github.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_REPORTS_API_TOKEN: ${{ secrets.CLOUDFLARE_REPORTS_API_TOKEN }}
