name: Re-run SME review gate

# The gate fails fast while the SME review is missing or running. When a review
# finishes, re-run the gate for that PR head so its check reports the result.
on:
  workflow_run:
    workflows: ["Aviation SME PR review"]
    types: [completed]

permissions:
  actions: write

jobs:
  rerun-gate:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'skipped' &&
      github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-run the gate for this PR head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            run=$(gh api "repos/$REPO/actions/workflows/aviation-sme-review-gate.yml/runs?head_sha=$HEAD_SHA&event=pull_request_target&per_page=1" \
              --jq '.workflow_runs[0] | select(.) | "\(.id) \(.status)"')
            if [ -z "$run" ]; then echo "No gate run for $HEAD_SHA."; exit 0; fi
            read -r id status <<< "$run"
            if [ "$status" = "completed" ]; then
              gh api -X POST "repos/$REPO/actions/runs/$id/rerun" && echo "Re-ran gate run $id." && exit 0
            fi
            sleep 20
          done
          echo "::warning::Gate run $id did not finish in time to re-run."
