name: PR 262 visual capture (temporary)
on:
  push:
    branches: [review/pr-262-browser-captures]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.4'
          cache: npm
      - run: npm ci
      - run: npm install --no-save --ignore-scripts playwright-core@1.56.1
      - name: Capture review page in Chrome
        env:
          OVERSWEEP_REVIEW_TRAINERS: '1'
        run: node scripts/review/f16-capture.mjs
      - name: Upload screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr-262-browser-screenshots
          path: review-screenshots/*.png
      - name: Fetch reference images for private geometry audit
        shell: bash
        run: |
          mkdir -p reference-inputs
          fetch() {
            if ! curl --location --silent --show-error --fail --retry 2 --max-time 20 "$2" --output "reference-inputs/$1"; then
              rm -f "reference-inputs/$1"
              echo "Reference unavailable: $1"
            fi
          }
          fetch elec-layout.gif https://www.xflight.de/original/parts/left_console/elec/elec_01.gif
          fetch elec-photo.jpg https://www.xflight.de/simulator/pictures/detail/sim_124.jpg
          fetch test-layout.gif https://www.xflight.de/original/parts/left_console/test/test.gif
          fetch test-photo.jpg https://www.xflight.de/original/parts/left_console/test/test_03.jpg
          fetch jfs-photo.jpg https://www.xflight.de/original/parts/left_console/engstart/engstart_03.jpg
          fetch jfs-layout.gif https://www.xflight.de/original/parts/left_console/engstart/engstart_02.gif
          fetch dcs-console.jpg https://cypher1778.github.io/DCS_Wiki/f-16c/images/dcs14-left_console.jpg
          fetch dcs-caution.jpg https://cypher1778.github.io/DCS_Wiki/f-16c/images/ss17-caution_panel.jpg
          fetch dcs-engine.jpg https://wiki.hoggitworld.com/images/1/10/ENG_Instruments.jpg
          file reference-inputs/* || true
      - name: Upload reference images as temporary analysis artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr-262-temporary-reference-inputs
          path: reference-inputs/*
          retention-days: 1
          if-no-files-found: warn
      - name: Commit captures only to temporary branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f review-screenshots/*.png
          git commit -m "Capture browser screenshots for PR #262" || exit 0
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)" push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
