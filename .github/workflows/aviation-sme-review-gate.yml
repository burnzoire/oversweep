name: Aviation SME review gate

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: aviation-sme-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Verify exact-head SME review
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/sme-review-gate.mjs
