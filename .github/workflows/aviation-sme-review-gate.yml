name: Aviation SME review gate

on:
  pull_request_target:
    # The gate runs only when a review label is added or removed. Running on every
    # push failed every content PR until its review, which spammed failure emails.
    types: [labeled, unlabeled]

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: aviation-sme-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    if: contains(fromJSON('["sme-passed","sme-override"]'), github.event.label.name)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Verify exact-head SME review
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/sme-review-gate.mjs
