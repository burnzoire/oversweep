name: PR preview
# Builds a PR for /preview/<sha>/ on the live site, when the PR carries the
# `preview` label or a maintainer comments `/preview` on it (which adds the
# label, so later pushes republish too). It uploads the build as the artifact
# preview-site-<sha>; the Pages workflow (pages.yml) runs after it on main,
# collects the latest preview of every open labelled PR and deploys them with
# the live site. Removing the label or closing the PR takes its preview down on
# the next deploy. Only branches of this repository are built, never forks.
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, closed]
  issue_comment:
    types: [created]
permissions:
  contents: read
concurrency:
  group: pr-preview-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Decides what this event asks for: build, remove or nothing.
  target:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event.issue.pull_request && startsWith(github.event.comment.body, '/preview') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    outputs:
      action: ${{ steps.target.outputs.action }}
      sha: ${{ steps.target.outputs.sha }}
      pr: ${{ steps.target.outputs.pr }}
    steps:
      - id: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          event="$GITHUB_EVENT_PATH"
          if [ "$GITHUB_EVENT_NAME" = issue_comment ]; then
            pr=$(jq -r .issue.number "$event")
            pull=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr")
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/comments/$(jq -r .comment.id "$event")/reactions" -f content=rocket >/dev/null || true
            action=build
            [ "$(jq -r .state <<<"$pull")" = open ] || action=none
          else
            pull=$(jq .pull_request "$event")
            pr=$(jq -r .number <<<"$pull")
            act=$(jq -r .action "$event")
            label=$(jq -r '.label.name // ""' "$event")
            labelled=$(jq -r 'any(.labels[]; .name == "preview")' <<<"$pull")
            action=none
            case "$act" in
              closed) [ "$labelled" = true ] && action=remove ;;
              unlabeled) [ "$label" = preview ] && action=remove ;;
              labeled) [ "$label" = preview ] && action=build ;;
              *) [ "$labelled" = true ] && action=build ;;
            esac
          fi
          if [ "$(jq -r .head.repo.full_name <<<"$pull")" != "$GITHUB_REPOSITORY" ]; then
            echo "::notice::PR #$pr is from a fork; previews only build this repository's branches."
            action=none
          fi
          if [ "$GITHUB_EVENT_NAME" = issue_comment ] && [ "$action" = build ]; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$pr/labels" -f "labels[]=preview" >/dev/null
          fi
          echo "PR #$pr: $action"
          { echo "action=$action"; echo "pr=$pr"; echo "sha=$(jq -r .head.sha <<<"$pull")"; } >> "$GITHUB_OUTPUT"
  build:
    needs: target
    if: needs.target.outputs.action == 'build'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUBLIC_PREVIEW_SHA: ${{ needs.target.outputs.sha }}
      PUBLIC_PREVIEW_PR: ${{ needs.target.outputs.pr }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.target.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
          cache: npm
      - run: npm ci
      - name: Build for /preview/<sha>/
        run: |
          rm -rf dist
          npx --no-install astro build --base "/preview/$PUBLIC_PREVIEW_SHA/"
          node scripts/check_site.mjs "/preview/$PUBLIC_PREVIEW_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-site-${{ needs.target.outputs.sha }}
          path: dist
          retention-days: 30
          if-no-files-found: error
  # Tells the Pages workflow to redeploy without this PR's preview.
  remove:
    needs: target
    if: needs.target.outputs.action == 'remove'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "${{ needs.target.outputs.pr }}" > remove.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-remove
          path: remove.txt
          retention-days: 1
